<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CCG Recruit Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one slanted licensing track across the top with a count at each step,
   hairline rows beneath it, recruit detail slides in from the right.
   Single dark look on purpose: the team brand is black with electric blue. */
:root{
  color-scheme:dark;
  --bg:#06080c; --panel:#0b0f16; --raise:#121823; --line:#1b2331; --line-2:#2b3649;
  --fg:#eaf0fa; --mut:#8e9aaf; --dim:#6f7b92;
  --blue:#2468ff; --blue-hi:#6aa2ff; --blue-ink:#ffffff; --blue-soft:rgba(36,104,255,.16);
  --ok:#2fd18a; --warn:#f5a524; --bad:#ff6b63;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:20px 72px;display:flex;flex-direction:column;gap:28px}

/* demo strip */
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 20px;background:var(--raise);border-bottom:1px solid var(--line);font-size:14px}
.demo-tag{font:800 italic 15px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.demo-txt{color:var(--mut);flex:1 1 200px;min-width:0}
.demo-btns{display:flex;flex-wrap:wrap;gap:4px 4px}
.demo-btns button{background:none;border:1px solid transparent;color:var(--mut);padding:6px 10px;border-radius:2px;cursor:pointer}
.demo-btns button:hover{color:var(--fg)}
.demo-btns button[aria-pressed="true"]{color:var(--fg);border-color:var(--line-2);background:var(--bg)}

/* type */
.big{font:800 italic clamp(34px,6vw,56px)/.95 var(--display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.h2{font:800 italic 24px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.eyebrow{font:700 italic 15px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--blue-hi)}
.lede{color:var(--mut);max-width:60ch}
.fine{color:var(--mut);font-size:14px;max-width:62ch}
.tag{font:700 italic 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}

/* wordmark + top bar */
.mark{display:flex;align-items:baseline;gap:10px}
.mark-a{font:800 italic 34px/.9 var(--display);letter-spacing:.02em;color:var(--blue-hi)}
.mark-b{font:700 italic 16px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--fg)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px 22px;flex-wrap:wrap;flex:1 1 auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 0 7px;font:700 italic 18px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);cursor:pointer}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--blue)}
.who{display:flex;align-items:center;gap:14px;color:var(--mut);font-size:14px;margin-left:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;border:1px solid var(--line-2);background:transparent;color:var(--fg);border-radius:2px;cursor:pointer;transform:skewX(-9deg);font:800 italic 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.btn>span{display:block;transform:skewX(9deg)}
.btn:hover{border-color:var(--blue-hi)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.pri:hover{background:#3a7bff;border-color:#3a7bff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 16px;font-size:16px}
.link{background:none;border:0;padding:10px 0;color:var(--blue-hi);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--fg)}
.link.bad{color:var(--bad)}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font:700 italic 14px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.f input,.f select,.f textarea,.inp{width:100%;min-height:46px;padding:10px 12px;background:var(--panel);border:1px solid var(--line-2);border-radius:2px;color:var(--fg)}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--blue-hi);outline:none;box-shadow:0 0 0 2px var(--blue-soft)}
.f [aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:14px;min-height:0}
.err:empty{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.alt{color:var(--mut);font-size:15px}

/* auth screens */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:40px 64px;align-items:start;padding-block:36px 72px}
.auth-l{display:flex;flex-direction:column;gap:22px;min-width:0}
.preview{counter-reset:s;display:grid;gap:0;border-top:1px solid var(--line);max-width:460px}
.preview li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);color:var(--fg)}
.preview li::before{content:counter(s);font:800 italic 20px/1 var(--display);color:var(--blue-hi)}
.auth-r{background:var(--panel);border:1px solid var(--line);padding:26px 24px 28px;min-width:0}

/* track */
.track{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:0;border-top:1px solid var(--line)}
.stop{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px 12px 14px 0;background:none;border:0;border-bottom:1px solid var(--line);border-top:3px solid var(--line-2);margin-top:-1px;cursor:pointer;min-width:0;transform-origin:left}
.stop-n{font:800 italic 44px/.85 var(--display);font-variant-numeric:tabular-nums;color:var(--fg)}
.stop-nm{font-size:13px;line-height:1.25;color:var(--mut)}
.stop.zero .stop-n{color:var(--dim)}
.stop:hover{border-top-color:var(--blue-hi)}
.stop[aria-pressed="true"]{border-top-color:var(--blue);background:linear-gradient(var(--blue-soft),transparent)}
.stop[aria-pressed="true"] .stop-n{color:var(--blue-hi)}
.stop[aria-pressed="true"] .stop-nm{color:var(--fg)}

/* tools row */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.tools .f{flex:1 1 220px}
.tools .f.narrow{flex:0 1 250px}

/* recruit rows */
.cols,.row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.6fr) 120px;gap:20px;align-items:center}
.cols{padding:0 0 8px;color:var(--dim);border-bottom:1px solid var(--line)}
.cols span:last-child{text-align:right}
.row{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer}
.row:hover{background:var(--panel)}
.r-who{display:flex;flex-direction:column;gap:2px;min-width:0}
.r-name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.r-sub{color:var(--mut);font-size:14px;overflow-wrap:anywhere}
.r-prog{display:flex;flex-direction:column;gap:7px;min-width:0}
.r-step{font-size:15px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.r-count{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.r-wait{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--mut);text-align:right}
.r-wait b{font:800 italic 30px/.9 var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.r-wait.stalled b,.r-wait.stalled .tag{color:var(--warn)}
.r-wait.done b{font-size:24px;color:var(--ok);letter-spacing:.06em;text-transform:uppercase}
.segs{display:flex;gap:3px;padding-left:3px}
.segs i{flex:1;height:8px;background:var(--line-2);transform:skewX(-24deg)}
.segs i.on{background:var(--blue)}
.segs.fin i.on{background:var(--ok)}
.segs.lg i{height:14px}
.empty{padding:28px 0;color:var(--mut);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}

/* checklist */
.chk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk-b{position:relative;width:28px;height:28px;display:block}
.chk-b input{position:absolute;inset:0;width:28px;height:28px;margin:0;opacity:0;cursor:pointer}
.box{position:absolute;inset:1px;border:2px solid var(--line-2);transform:skewX(-10deg);display:grid;place-items:center}
.chk-b input:checked + .box{background:var(--blue);border-color:var(--blue)}
.chk-b input:checked + .box::after{content:"";width:11px;height:6px;border-left:3px solid var(--blue-ink);border-bottom:3px solid var(--blue-ink);transform:skewX(10deg) rotate(-45deg) translate(1px,-2px)}
.chk-b input:focus-visible + .box{outline:2px solid var(--blue-hi);outline-offset:3px}
.chk-b input:disabled + .box{opacity:.55}
.chk-nm{min-width:0;overflow-wrap:anywhere}
.chk-dt{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chk.next .chk-nm{font-weight:600}
.chk.next .chk-dt{color:var(--blue-hi)}
.chk.locked{cursor:default}
.checklist{border-top:1px solid var(--line)}
.chk.has-how{border-bottom:0;padding-bottom:2px}
.how{padding:0 0 12px 42px;border-bottom:1px solid var(--line)}
.how summary{display:inline-flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;color:var(--blue-hi);font-size:14px;list-style:none}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-right:2px}
.how[open] summary::before{transform:rotate(45deg) translate(-2px,-2px)}
.how summary:hover{color:var(--fg)}
.how-b{display:flex;flex-direction:column;gap:8px;padding:4px 0 2px;max-width:56ch;min-width:0}
.how-b p{color:var(--fg);font-size:15px}
.links{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:0}
.links a{color:var(--blue-hi);padding:7px 0;text-underline-offset:3px;overflow-wrap:anywhere}
.links a:hover{color:var(--fg)}
.nolink{color:var(--mut);padding:7px 0}

/* recruit's own page */
.me{display:flex;flex-direction:column;gap:18px;max-width:640px}

/* detail panel */
.scrim{position:fixed;inset:0;background:rgba(3,5,8,.72);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);z-index:21;background:var(--panel);border-left:1px solid var(--line-2);overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:calc(14px + env(safe-area-inset-top,0px)) 22px calc(40px + env(safe-area-inset-bottom,0px))}
.panel-top{display:flex;justify-content:flex-end}
.p-meta{color:var(--mut)}
.contact{display:grid;gap:0;border-top:1px solid var(--line)}
.contact div{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.contact dt{color:var(--mut);font-size:14px}
.contact dd{min-width:0;overflow-wrap:anywhere;user-select:all}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h small{color:var(--mut);font-size:14px}
.notes{display:flex;flex-direction:column;gap:14px}
.notes li{border-left:2px solid var(--line-2);padding-left:12px}
.notes .n-by{color:var(--mut);font-size:13px}
.confirm{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px;border:1px solid var(--bad);color:var(--fg)}
.confirm p{flex:1 1 200px;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;border-top:1px solid var(--line);padding-top:10px}

/* steps editor */
.sedit{border-top:1px solid var(--line);max-width:720px}
.sedit>li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sn{font:800 italic 22px/1 var(--display);color:var(--blue-hi);font-variant-numeric:tabular-nums}
.sacts{display:flex;gap:0 14px;align-items:center}
.sedit .note{grid-column:2 / -1;color:var(--mut);font-size:14px}
.sedit .confirm{grid-column:1 / -1}
.addstep{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;max-width:720px}
.addstep .f{flex:1 1 240px}

/* team */
.team{border-top:1px solid var(--line);max-width:720px}
.team li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.team .t-who{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.team .t-who span{color:var(--mut);font-size:14px}
.role{color:var(--blue-hi)}

#flash{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:2px;font-weight:600;font-size:15px;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .wrap{padding-inline:16px;gap:22px}
  .demo{padding-inline:16px}
  .auth{grid-template-columns:minmax(0,1fr);padding-block:20px 64px}
  .auth-r{padding:22px 16px 24px}
  .two{grid-template-columns:1fr}
  .cols{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who wait" "prog prog";gap:10px 14px}
  .r-who{grid-area:who}.r-prog{grid-area:prog}.r-wait{grid-area:wait}
  .track{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stop-n{font-size:36px}
  .who{margin-left:0;width:100%;justify-content:space-between}
  .sedit>li{grid-template-columns:26px minmax(0,1fr)}
  .sacts{grid-column:2}
  .team li{grid-template-columns:minmax(0,1fr) auto}
  .team li .link{grid-column:1 / -1;justify-self:start}
}
@media (prefers-reduced-motion:no-preference){
  .panel.enter{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

</head>

function checkApply(f){
  const e = {};
  const name = String(f.name||'').trim().replace(/\s+/g,' ');
  let digits = String(f.phone||'').replace(/\D/g,'');
  if (digits.length === 11 && digits[0] === '1') digits = digits.slice(1);
  const email = String(f.email||'').trim().toLowerCase();
  const pw = String(f.password||'');
  if (name.length < 2 || name.length > 80) e.name = 'Enter your full name.';
  if (digits.length !== 10) e.phone = 'Enter a 10-digit phone number.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = 'Enter a valid email address.';
  if (!STATES.includes(f.state)) e.state = 'Pick your state.';
  if (!REFERRERS.includes(f.referredBy)) e.referredBy = 'Pick who referred you.';
  if (pw.length < 8) e.password = 'Use at least 8 characters.';
  return {e, name, digits, email, pw, state:f.state, referredBy:f.referredBy};
}
function fieldError(e){ const err = new Error('Check the form.'); err.fields = e; return err; }

const me = () => db.users.find(u => u.id === session) || null;
const userOf = r => db.users.find(u => u.id === r.userId);
function need(...roles){
  const u = me();
  if (!u || !roles.includes(u.role)) throw new Error('Not allowed.');
  return u;
}
const MGR = ['owner','manager'];

const api = {
  me,
  steps(){ return db.steps; },
  signIn(email, pw){
    const u = db.users.find(x => x.email === String(email).trim().toLowerCase());
    if (!u || u.password !== pw) throw new Error('Email or password is wrong.');
    session = u.id; return u;
  },
  signOut(){ session = null; },
  apply(f){
    const c = checkApply(f), e = c.e;
    if (!e.email && db.users.some(u => u.email === c.email)) e.email = 'That email already has a login. Sign in instead.';
    if (Object.keys(e).length) throw fieldError(e);
    const name = c.name, digits = c.digits, email = c.email, pw = c.pw;
    const n = ++db.seq, now = new Date().toISOString();
    const user = {id:'u-n'+n, name, email, password:pw, role:'recruit'};
    db.users.push(user);
    db.recruits.push({id:'n'+n, userId:user.id, name, state:f.state,
      phone:'('+digits.slice(0,3)+') '+digits.slice(3,6)+'-'+digits.slice(6),
      email, referredBy:f.referredBy, appliedAt:now,
      done:{[db.steps[0].id]:now}, notes:[]});
    session = user.id;
    return user;
  },
  myRecruit(){
    const u = need('recruit');
    return db.recruits.find(r => r.userId === u.id) || null;
  },
  listRecruits(){
    need(...MGR);
    return db.recruits.filter(r => userOf(r).role === 'recruit');
  },
  getRecruit(id){
    const u = me(); if (!u) throw new Error('Not allowed.');
    const r = db.recruits.find(x => x.id === id);
    if (!r) throw new Error('That recruit no longer exists.');
    if (u.role === 'recruit' && r.userId !== u.id) throw new Error('Not allowed.');
    return r;
  },
  setStep(rid, sid, on){
    const r = api.getRecruit(rid);
    const s = db.steps.find(x => x.id === sid);
    if (!s) throw new Error('That step no longer exists.');
    if (s.auto) throw new Error('That step is ticked automatically.');
    if (on) r.done[sid] = new Date().toISOString(); else delete r.done[sid];
  },
  addNote(rid, text){
    const u = need(...MGR), r = api.getRecruit(rid);
    const t = String(text||'').trim();
    if (!t) throw new Error('Write the note first.');
    r.notes.unshift({by:u.name, at:new Date().toISOString(), text:t});
  },
  removeRecruit(rid){
    need(...MGR);
    const r = api.getRecruit(rid);
    db.recruits = db.recruits.filter(x => x.id !== rid);
    db.users = db.users.filter(x => x.id !== r.userId);
  },
  addStep(name){
    need(...MGR);
    const t = String(name||'').trim();
    if (!t) throw new Error('Type a name for the step.');
    db.steps.push({id:'s'+(++db.seq), name:t});
  },
  renameStep(id, name){
    need(...MGR);
    const t = String(name||'').trim(), s = db.steps.find(x => x.id === id);
    if (!s) return;
    if (!t) throw new Error('A step needs a name.');
    s.name = t;
  },
  moveStep(id, dir){
    need(...MGR);
    const i = db.steps.findIndex(x => x.id === id), j = i + dir;
    if (i < 1 || j < 1 || j >= db.steps.length) return;
    const [s] = db.steps.splice(i, 1); db.steps.splice(j, 0, s);
  },
  removeStep(id){
    need(...MGR);
    const s = db.steps.find(x => x.id === id);
    if (!s || s.auto) throw new Error('That step cannot be removed.');
    db.steps = db.steps.filter(x => x.id !== id);
    db.recruits.forEach(r => { delete r.done[id]; });
  },
  listManagers(){
    need(...MGR);
    return db.users.filter(u => MGR.includes(u.role));
  },
  setRole(userId, role){
    need('owner');
    const u = db.users.find(x => x.id === userId);
    if (!u || u.role === 'owner' || !['manager','recruit'].includes(role)) throw new Error('Not allowed.');
    u.role = role;
  }
};

/* ------------------------------------------------------------------ backends
   The screens only ever read from D (a snapshot) and call B (the backend).
   Demo: B wraps the sample data above.  Live: B talks to the real database,
   where the same "who may do what" rules are enforced again by the database. */
const D = {ready:false, error:'', me:null, steps:[], recruits:[], mine:null, managers:[]};
const clone = x => JSON.parse(JSON.stringify(x));

const demoBackend = {
  async load(){
    const u = api.me();
    const d = {me:u ? {id:u.id, name:u.name, email:u.email, role:u.role} : null, steps:clone(api.steps()), recruits:[], mine:null, managers:[]};
    if (u && u.role === 'recruit') d.mine = clone(api.myRecruit());
    else if (u){ d.recruits = clone(api.listRecruits()); d.managers = api.listManagers().map(m => ({id:m.id, name:m.name, email:m.email, role:m.role})); }
    return d;
  },
  async signIn(e, p){ api.signIn(e, p); },
  async signOut(){ api.signOut(); },
  async apply(f){ return {name:api.apply(f).name}; },
  async setStep(r, sid, on){ api.setStep(r, sid, on); },
  async addNote(r, t){ api.addNote(r, t); },
  async removeRecruit(r){ api.removeRecruit(r); },
  async addStep(n){ api.addStep(n); },
  async renameStep(i, n){ api.renameStep(i, n); },
  async moveStep(i, dir){ api.moveStep(i, dir); },
  async removeStep(i){ api.removeStep(i); },
  async setRole(uid, role){ api.setRole(uid, role); }
};

function liveBackend(){
  const sb = window.supabase.createClient(CONFIG.url, CONFIG.key);
  const nice = e => new Error(!e ? 'Something went wrong.'
    : (e.code === '42501' || /row-level security|permission denied|not allowed/i.test(e.message || '')) ? 'Not allowed.'
    : /failed to fetch|networkerror|load failed/i.test(e.message || '') ? 'No connection. Check your internet and try again.'
    : (e.message || 'Something went wrong.'));
  const q = async p => { const {data, error} = await p; if (error) throw nice(error); return data; };
  const text = (v, msg) => { const t = String(v || '').trim(); if (!t) throw new Error(msg); return t; };
  async function all(table, cols, order){          // the API hands back 1000 rows at a time
    const out = [];
    for (let from = 0; ; from += 1000){
      let b = sb.from(table).select(cols);
      order.forEach(o => { b = b.order(o[0], {ascending:o[1] !== false}); });
      const rows = await q(b.range(from, from + 999));
      out.push(...rows);
      if (rows.length < 1000) return out;
    }
  }
  return {
    async load(){
      const d = {me:null, steps:[], recruits:[], mine:null, managers:[]};
      const {data:{session}} = await sb.auth.getSession();
      d.steps = (await q(sb.from('steps').select('id,name,position,auto').order('position'))).map(s => ({id:s.id, name:s.name, auto:s.auto}));
      if (!session) return d;
      const uid = session.user.id;
      const profs = await all('profiles', 'id,role,name,email', [['name'], ['id']]);
      const mine = profs.find(p => p.id === uid);
      if (!mine){ await sb.auth.signOut(); return d; }             // this login was removed
      d.me = {id:uid, name:mine.name, email:mine.email, role:mine.role};
      const mgr = mine.role !== 'recruit';
      const [recs, ticks, notes] = await Promise.all([
        all('recruits', 'id,user_id,name,state,phone,email,referred_by,applied_at', [['applied_at'], ['id']]),
        all('progress', 'recruit_id,step_id,done_at', [['recruit_id'], ['step_id']]),
        mgr ? all('notes', 'id,recruit_id,author_name,body,created_at', [['created_at', false], ['id']]) : []
      ]);
      const byId = {};
      const shaped = recs.map(r => (byId[r.id] = {id:r.id, userId:r.user_id, name:r.name, state:r.state, phone:r.phone, email:r.email,
        referredBy:r.referred_by, appliedAt:r.applied_at, done:{}, notes:[]}));
      ticks.forEach(t => { if (byId[t.recruit_id]) byId[t.recruit_id].done[t.step_id] = t.done_at; });
      notes.forEach(n => { if (byId[n.recruit_id]) byId[n.recruit_id].notes.push({by:n.author_name, at:n.created_at, text:n.body}); });
      if (!mgr){ d.mine = shaped.find(r => r.userId === uid) || null; return d; }
      const role = {}; profs.forEach(p => { role[p.id] = p.role; });
      d.recruits = shaped.filter(r => role[r.userId] === 'recruit');
      d.managers = profs.filter(p => p.role !== 'recruit').sort((a, b) => (b.role === 'owner') - (a.role === 'owner') || a.name.localeCompare(b.name))
        .map(p => ({id:p.id, name:p.name, email:p.email, role:p.role}));
      return d;
    },
    async signIn(email, pw){
      const {error} = await sb.auth.signInWithPassword({email:String(email).trim(), password:pw});
      if (error) throw (/invalid/i.test((error.code || '') + ' ' + (error.message || '')) ? new Error('Email or password is wrong.') : nice(error));
    },
    async signOut(){ await sb.auth.signOut(); },
    async apply(f){
      const c = checkApply(f);
      if (Object.keys(c.e).length) throw fieldError(c.e);
      const {data, error} = await sb.auth.signUp({email:c.email, password:c.pw,
        options:{data:{name:c.name, phone:c.digits, state:c.state, referred_by:c.referredBy}}});
      if (error){
        const m = (error.code || '') + ' ' + (error.message || '');
        if (/already|exists/i.test(m)) throw fieldError({email:'That email already has a login. Sign in instead.'});
        if (/password/i.test(m)) throw fieldError({password:error.message});
        if (/rate|too many/i.test(m)) throw new Error('Too many sign-ups right now. Wait a minute and try again.');
        if (/database error/i.test(m)) throw new Error('The form was refused. Check each field and try again.');
        throw nice(error);
      }
      if (!data.session) throw new Error('Your login was made but is waiting on a confirmation step. Tell your manager.');
      return {name:c.name};
    },
    async setStep(rid, sid, on){
      if (!on) return void await q(sb.from('progress').delete().eq('recruit_id', rid).eq('step_id', sid));
      const {error} = await sb.from('progress').insert({recruit_id:rid, step_id:sid});
      if (error && error.code !== '23505') throw nice(error);          // 23505 = already ticked
    },
    async addNote(rid, t){ await q(sb.from('notes').insert({recruit_id:rid, body:text(t, 'Write the note first.')})); },
    async removeRecruit(rid){ await q(sb.rpc('remove_recruit', {rid})); },
    async addStep(n){ await q(sb.from('steps').insert({name:text(n, 'Type a name for the step.')})); },
    async renameStep(id, n){ await q(sb.from('steps').update({name:text(n, 'A step needs a name.')}).eq('id', id)); },
    async moveStep(id, dir){ await q(sb.rpc('move_step', {sid:id, dir})); },
    async removeStep(id){ await q(sb.from('steps').delete().eq('id', id)); },
    async setRole(uid, role){ await q(sb.rpc('set_role', {target:uid, new_role:role})); }
  };
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = iso => new Date(iso).toLocaleDateString('en-US', {month:'short', day:'numeric'});
const daysSince = iso => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / DAY));
const dayWord = n => n === 0 ? 'today' : n === 1 ? '1 day ago' : n + ' days ago';

function prog(r){
  const steps = D.steps;
  const idx = steps.map((s, i) => r.done[s.id] ? i : -1).filter(i => i >= 0);
  const dates = idx.map(i => r.done[steps[i].id]);
  const last = dates.length ? dates.reduce((a, b) => a > b ? a : b) : r.appliedAt;
  const finished = idx.length === steps.length;
  const wait = daysSince(last);
  return {count:idx.length, total:steps.length, far:idx.length ? Math.max(...idx) : -1,
          next:steps.findIndex(s => !r.done[s.id]), last, wait, finished,
          stalled:!finished && wait >= STALL_DAYS};
}
const segs = (r, cls) => '<span class="segs ' + (cls||'') + '" aria-hidden="true">' +
  D.steps.map(s => '<i' + (r.done[s.id] ? ' class="on"' : '') + '></i>').join('') + '</span>';
const btn = (label, attrs, cls) => '<button class="btn ' + (cls||'') + '" ' + (attrs||'') + '><span>' + esc(label) + '</span></button>';
const mark = () => '<div class="mark"><span class="mark-a">CCG</span><span class="mark-b">Recruit Tracker</span></div>';

/* ------------------------------------------------------------------ how-to help
   Per-state links come from the "Licensing links" sheet (STATE_LINKS).
   The wording and the other links come from the team's "How to Get Licensed" doc.
   Parts of that doc that name California or Los Angeles only show for CA recruits. */
const GUIDE = {
  nipr:'https://nipr.com/',
  examCA:'https://test-takers.psiexams.com/cadi/available/test/RZH7TGU4',
  psiCA:'https://www.psiexams.com/test-takers/?jsf=jet-engine:sd_test-takers&meta=industry:Insurance;the_state:California',
  printsCA:'https://accuratebiometrics.com/california-department-of-insurance',
  eno:'https://eno.surancebay.com/errors-and-omissions-insurance--life-and-health-agent--new.html',
  aml:'https://aml.surancebay.com/',
  loom:'https://www.loom.com/share/c72219624dff45a8b230e4799918a292'
};
const stateName = code => STATE_NAMES[code] || code;
const questionsUrl = code => STATE_LINKS[code]
  ? 'https://staterequirement.com/become-a-life-insurance-agent/' + STATE_NAMES[code].toLowerCase().replace(/ /g, '-') + '-life-insurance-license/'
  : null;
function stepHelp(sid, code){
  const L = STATE_LINKS[code], st = stateName(code), ca = code === 'CA';
  const h = {text:[], links:[]};
  const link = (label, url) => { if (url) h.links.push({label, url}); };
  const none = () => { if (!L) h.text.push('No links are listed for ' + st + ' yet. Ask your manager.'); };
  if (sid === 'course_start'){
    h.text.push('Do your pre-licensing course on Xcel Solutions. Pick life only, not health.');
    h.text.push('Partner code atlasshrier (top right of their site) takes $150 off.');
    none(); if (L) link(st + ' life course on Xcel Solutions', L.course);
  } else if (sid === 'exam_sched'){
    if (ca) h.text.push('The test is online and proctored, with unlimited attempts.');
    none();
    if (ca){ link('California life exam on PSI', GUIDE.examCA); link('PSI page for California test takers', GUIDE.psiCA); }
    if (L) link(st + ' exam provider', L.exam);
  } else if (sid === 'prints'){
    if (ca) h.text.push('Los Angeles location: 6080 Center Dr, Suite #600, Los Angeles, CA 90045.');
    none();
    if (L && !L.prints) h.text.push('The team sheet lists no fingerprint link for ' + st + '. Ask your manager whether you need fingerprints.');
    if (L) link(st + ' fingerprinting', L.prints);
    if (ca) link('Los Angeles location details', GUIDE.printsCA);
  } else if (sid === 'lic_app'){
    h.text.push('Apply for your license on NIPR.com. You can do it the same day as your fingerprints.');
    link('NIPR.com', GUIDE.nipr);
    if (L) link(st + ' department of insurance', L.doi);
  } else if (sid === 'contracts'){
    h.text.push('First get E&O coverage (choose plan A) and do your AML training.');
    h.text.push('Then get contracted with the carriers we partner with. There are two contract links. Ask your manager for them.');
    h.text.push('Upload the EFT contract with your bank info so your commissions get paid.');
    h.text.push('Once contracts are in for every carrier, training starts.');
    link('E&O coverage (errors and omissions insurance)', GUIDE.eno);
    link('AML training (anti-money-laundering)', GUIDE.aml);
    link('Contracting tutorial video', GUIDE.loom);
  } else return null;
  return h;
}

    '<ul class="team">' + mgrs.map(m => '<li><span class="t-who">' + esc(m.name) + (m.id === u.id ? ' (you)' : '') + '<span>' + esc(m.email) + '</span></span>' +
      '<span class="tag role">' + (m.role === 'owner' ? 'Owner' : 'Manager') + '</span>' +
      (u.role === 'owner' && m.role === 'manager' ? '<button class="link bad" data-act="demote" data-id="' + m.id + '">Remove manager access</button>' : '<span></span>') + '</li>').join('') + '</ul>' +
    '<p class="fine">To add a manager: they sign up on the apply page, you open their name under Recruits, then choose Make manager. Removing access puts them back in the recruit list.</p>';
}

function managerView(u){
  const body = S.tab === 'steps' ? stepsTab() : S.tab === 'team' ? teamTab(u) : recruitsTab();
  return '<div class="wrap">' + topBar(u, true) + body + '</div>' + (S.openId ? panel(u) : '');
}

/* ------------------------------------------------------------------ render */
function waitView(){
  return '<div class="wrap">' + mark() + '<p class="lede">' + (D.error
    ? 'Could not reach the tracker. Check your connection, then reload this page.' : 'Loading') + '</p></div>';
}
function render(focusId){
  const a = document.activeElement;
  const keep = {id:focusId || (a && a.id) || null, vals:{}, scroll:$('#panel') ? $('#panel').scrollTop : 0};
  try { if (a && a.id && !focusId && typeof a.selectionStart === 'number') keep.sel = [a.selectionStart, a.selectionEnd]; } catch (e) {}
  document.querySelectorAll('[data-keep]').forEach(el => { keep.vals[el.id] = el.value; });
  $('#demo').innerHTML = LIVE ? '' : demoBar();
  const u = D.me;
  $('#app').innerHTML = (!D.ready || D.error) ? waitView() : !u ? authView() : u.role === 'recruit' ? recruitView(u) : managerView(u);
  Object.keys(keep.vals).forEach(id => { const el = document.getElementById(id); if (el) el.value = keep.vals[id]; });
  if ($('#panel')) $('#panel').scrollTop = keep.scroll;
  if (keep.id){
    const el = document.getElementById(keep.id);
    if (el){ el.focus({preventScroll:true}); if (keep.sel){ try { el.setSelectionRange(keep.sel[0], keep.sel[1]); } catch (e) {} } }
  }
}
function setErr(id, msg){
  const p = document.getElementById('err-' + id), el = document.getElementById(id);
  if (p) p.textContent = msg || '';
  if (el){ if (msg) el.setAttribute('aria-invalid','true'); else el.removeAttribute('aria-invalid'); }
}
function closePanel(){ const id = S.openId; S.openId = null; S.confirm = null; render(id ? 'row-' + id : null); }
const openRecruit = () => D.recruits.find(x => x.id === S.openId);

/* One action at a time. If one fails, say why and show what is really saved. */
let busy = false;
async function run(fn, arg){
  if (busy) return;
  busy = true;
  try { await fn(arg); }
  catch (err) { flash((err && err.message) || 'Something went wrong.'); try { await sync(); } catch (e) {} render(); }
  finally { busy = false; }
}

/* ------------------------------------------------------------------ actions */
const act = {
  async demo(t){
    S.openId = null; S.confirm = null; S.help = {};
    await B.signOut();
    if (t.dataset.go === 'recruit') await B.signIn('dana@example.com','demo1234');
    else if (t.dataset.go === 'manager') await B.signIn('owner@example.com','demo1234');
    else S.auth = 'apply';
    S.tab = 'recruits'; await sync(); render(); window.scrollTo(0, 0);
  },
  async 'demo-reset'(){ seed(); Object.assign(S, {auth:'apply', tab:'recruits', q:'', step:null, sort:'wait', openId:null, confirm:null, help:{}}); await B.signIn('owner@example.com','demo1234'); await sync(); render(); flash('Sample data reset'); },
  auth(t){ S.auth = t.dataset.mode; render(); },
  async signout(){ await B.signOut(); Object.assign(S, {auth:'signin', tab:'recruits', q:'', step:null, openId:null, confirm:null, help:{}}); await sync(); render(); },
  tab(t){ S.tab = t.dataset.tab; S.confirm = null; render(); },
  filter(t){ S.step = S.step === t.dataset.step ? null : t.dataset.step; render(); },
  clear(){ S.step = null; S.q = ''; render('q'); },
  open(t){ S.openId = t.dataset.id; S.confirm = null; S.fresh = true; render('p-close'); S.fresh = false; },
  close(){ closePanel(); },
  how(t){ const d = t.parentElement; S.help[d.dataset.how] = !d.open; },
  copy(t){
    const el = document.getElementById(t.dataset.target), text = el.textContent;
    const pick = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); flash('Selected. Copy it from here.'); };
    try { navigator.clipboard.writeText(text).then(() => flash('Copied'), pick); } catch (e) { pick(); }
  },
  remove(){ S.confirm = 'remove'; render('rm-yes'); },
  promote(){ S.confirm = 'promote'; render('pm-yes'); },
  'confirm-no'(){ S.confirm = null; render(); },
  async 'remove-yes'(){ const r = openRecruit(); await B.removeRecruit(r.id); S.openId = null; S.confirm = null; await sync(); render('q'); flash(r.name + ' removed'); },
  async 'promote-yes'(){ const r = openRecruit(); await B.setRole(r.userId, 'manager'); S.openId = null; S.confirm = null; await sync(); render('q'); flash(r.name + ' is now a manager'); },
  async demote(t){ await B.setRole(t.dataset.id, 'recruit'); await sync(); render(); flash('Manager access removed'); },
  async mv(t){
    const dir = Number(t.dataset.dir);
    await B.moveStep(t.dataset.id, dir); await sync(); render((dir < 0 ? 'up-' : 'dn-') + t.dataset.id);
    if (document.activeElement && document.activeElement.disabled) document.getElementById('sname-' + t.dataset.id).focus();
  },
  'rm-step'(t){ S.confirm = 'step:' + t.dataset.id; render(); },
  async 'rm-step-yes'(t){ await B.removeStep(t.dataset.id); S.confirm = null; if (S.step === t.dataset.id) S.step = null; await sync(); render('new-step'); flash('Step removed'); }
};
const forms = {
  async apply(f){
    const ids = {name:'f-name', phone:'f-phone', state:'f-state', email:'f-email', referredBy:'f-ref', password:'f-password'};
    Object.values(ids).forEach(id => setErr(id, ''));
    const v = n => f.elements[n].value;
    try {
      const u = await B.apply({name:v('name'), phone:v('phone'), email:v('email'), state:v('state'), referredBy:v('referredBy'), password:v('password')});
      await sync(); render(); window.scrollTo(0, 0); flash('Login created. Welcome, ' + u.name.split(' ')[0] + '.');
    } catch (e) {
      if (!e.fields){ setErr('f-password', e.message); return; }      // keep what they typed
      let first;
      Object.keys(ids).forEach(k => { if (e.fields[k]){ setErr(ids[k], e.fields[k]); first = first || ids[k]; } });
      if (first) document.getElementById(first).focus();
    }
  },
  async signin(f){
    setErr('s-password', '');
    try { await B.signIn(f.elements.email.value, f.elements.password.value); S.tab = 'recruits'; await sync(); render(); window.scrollTo(0, 0); }
    catch (e) { setErr('s-password', e.message); }
  },
  async note(){
    const ta = document.getElementById('note-text');
    try { await B.addNote(S.openId, ta.value); ta.value = ''; await sync(); render('note-text'); flash('Note saved'); }
    catch (e) { setErr('note-text', e.message); ta.focus(); }
  },
  async addstep(){
    const inp = document.getElementById('new-step');
    try { await B.addStep(inp.value); await sync(); render('new-step'); document.getElementById('new-step').value = ''; flash('Step added'); }
    catch (e) { setErr('new-step', e.message); inp.focus(); }
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = act[t.dataset.act];
  if (fn) run(fn, t);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fn = forms[f.dataset.form];
  if (!fn || busy) return;
  const b = f.querySelector('[type="submit"]');
  if (b) b.disabled = true;
  run(fn, f).then(() => { if (b && b.isConnected) b.disabled = false; });
});
document.addEventListener('input', e => {
  if (e.target.dataset.input === 'q'){ S.q = e.target.value; render(); }
});
document.addEventListener('change', e => {
  const t = e.target, kind = t.dataset.change;
  if (kind === 'sort'){ S.sort = t.value; render(); return; }
  if (kind !== 'step' && kind !== 'rename') return;
  if (busy){ if (kind === 'step') t.checked = !t.checked; return; }     // nothing was saved, so do not show it as saved
  if (kind === 'step') run(async () => { const on = t.checked; await B.setStep(t.dataset.rid, t.dataset.sid, on); await sync(); render(); flash(on ? 'Step ticked' : 'Step unticked'); });
  else run(async () => { await B.renameStep(t.dataset.id, t.value); await sync(); flash('Step renamed'); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.openId) closePanel(); });
document.addEventListener('visibilitychange', () => {                   // coming back to the tab shows what others changed
  if (LIVE && D.ready && D.me && document.visibilityState === 'visible') run(async () => { await sync(); render(); });
});

/* ------------------------------------------------------------------ start */
const start = (location.hash || '').replace('#', '');
if (LIVE) S.auth = start === 'apply' ? 'apply' : 'signin';
else {
  seed();
  if (start === 'apply') S.auth = 'apply';
  else if (start === 'recruit') api.signIn('dana@example.com','demo1234');
  else api.signIn('owner@example.com','demo1234');
}
render();
sync().then(() => render(), err => { D.error = (err && err.message) || 'error'; render(); });
window.__recruitTracker = LIVE ? {live:true} : {api, state:S, stepHelp, questionsUrl, STATE_LINKS, STATE_NAMES};
})();
</script>

</body>
</html>
